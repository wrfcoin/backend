          in: path
          required: true
          schema:
            type: string
          description: Task identifier
      responses:
        '200':
          description: Task status retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  taskId:
                    type: string
                  status:
                    type: string
                    enum: [queued, running, completed, failed]
                  progress:
                    type: integer
                    minimum: 0
                    maximum: 100
                  provider:
                    type: string
                  estimatedCompletion:
                    type: string
                  resourceUsage:
                    type: object
                    properties:
                      cpu:
                        type: number
                      memory:
                        type: number
                      storage:
                        type: number
                  cost:
                    type: string
        '404':
