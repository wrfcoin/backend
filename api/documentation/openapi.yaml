openapi: 3.0.3
info:
  title: Wrfcoin Blockchain Platform API
  description: |
    Comprehensive API for the Wrfcoin climate-focused blockchain platform.
    Includes weather data collection, smart contracts, cross-chain bridges,
    governance, and environmental impact tracking.
  version: 1.0.0
  contact:
    name: Wrfcoin API Support
    email: api@wrfcoin.com
    url: https://docs.wrfcoin.com
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  termsOfService: https://wrfcoin.com/terms

servers:
  - url: https://api.wrfcoin.com/v1
    description: Production server
  - url: https://staging-api.wrfcoin.com/v1
    description: Staging server
  - url: http://localhost:3001
    description: Local development server

security:
  - ApiKeyAuth: []
  - BearerAuth: []

tags:
  - name: Blockchain
    description: Core blockchain operations
  - name: Smart Contracts
    description: Smart contract deployment and execution
  - name: Cross-Chain Bridge
    description: Cross-chain asset transfers
  - name: Governance
    description: DAO governance and voting
  - name: Weather Data
    description: Environmental data collection and rewards
  - name: Wallet
    description: Wallet and key management
  - name: NFT
    description: Computational and environmental NFTs
  - name: IoT
    description: IoT sensor network management
  - name: Mining
    description: Mining operations and rewards
  - name: Analytics
    description: Network analytics and metrics
  - name: System
    description: System health and status
  - name: Security
    description: Security operations and statistics
  - name: File Integrity
    description: File integrity verification and hash generation
  - name: Compliance
    description: Compliance status and certifications
  - name: Integrations
    description: Third-party integrations and AI services
  - name: Compute
    description: Compute network operations
  - name: AI/ML
    description: AI and machine learning services
  - name: Performance
    description: Performance monitoring and optimization
  - name: Auth
    description: Authentication and HSM signing
  - name: Bridges
    description: Cross-chain bridge operations
  - name: Carbon
    description: Carbon credit tracking and trading
  - name: Capabilities
    description: Runtime feature capabilities
  - name: Meshtastic
    description: LoRa mesh network gateway
  - name: NFT
    description: NFT management
  - name: Computational
    description: Computational NFT operations
  - name: Protocol
    description: Protocol transition state
  - name: Resilience
    description: Borderless participation and resilience
  - name: Onboarding
    description: Faucet and user onboarding
  - name: Identity
    description: Decentralized identity management
  - name: MFA
    description: Multi-factor authentication
  - name: OAuth
    description: OAuth provider integration
  - name: WebAuthn
    description: WebAuthn/FIDO2 credentials
  - name: Sessions
    description: Session management
  - name: Oracle
    description: Oracle network operations
  - name: Sanctions
    description: Sanctions orchestration
  - name: Privacy
    description: Privacy settings and ZK proofs
  - name: PoP
    description: Proof of Publishing consensus
  - name: Sharding
    description: Blockchain sharding
  - name: Reputation
    description: Identity reputation scoring
  - name: Rewards
    description: Reward distribution and config
  - name: Forecast
    description: Forecast jobs and verification
  - name: Storage
    description: Data storage operations
  - name: Flux
    description: Flux compute operations
  - name: WVM
    description: Weather Virtual Machine
  - name: Account Abstraction
    description: ERC-4337 smart wallet and account abstraction operations
  - name: BigchainDB
    description: BigchainDB decentralized asset management
  - name: LayerZero
    description: LayerZero cross-chain messaging and token transfers
  - name: Internet Computer
    description: Internet Computer Protocol (ICP) canister integration
  - name: Regulatory Reporting
    description: Automated regulatory reporting and compliance
  - name: Alignment KPIs
    description: Platform alignment and performance KPIs
  - name: OpenForis
    description: OpenForis survey and field data collection
  - name: Incident Automation
    description: Automated incident detection and response
  - name: Wallet Auth
    description: Wallet-based authentication and JWT issuance

paths:
  # Blockchain Operations
  /api/blockchain/status:
    get:
      tags: [Blockchain]
      summary: Get blockchain status
      description: Returns current blockchain status including block height, network health, and consensus state
      responses:
        '200':
          description: Blockchain status retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BlockchainStatus'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/blockchain/blocks:
    get:
      tags: [Blockchain]
      summary: Get blockchain blocks
      description: Retrieve a list of blockchain blocks with pagination
      parameters:
        - name: limit
          in: query
          description: Number of blocks to return
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
        - name: offset
          in: query
          description: Number of blocks to skip
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: order
          in: query
          description: Sort order
          schema:
            type: string
            enum: [asc, desc]
            default: desc
      responses:
        '200':
          description: Blocks retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  blocks:
                    type: array
                    items:
                      $ref: '#/components/schemas/Block'
                  total:
                    type: integer
                  pagination:
                    $ref: '#/components/schemas/Pagination'

  /api/blockchain/blocks/{blockHash}:
    get:
      tags: [Blockchain]
      summary: Get block by hash
      parameters:
        - name: blockHash
          in: path
          required: true
          schema:
            type: string
            pattern: '^0x[a-fA-F0-9]{64}$'
      responses:
        '200':
          description: Block retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Block'
        '404':
          description: Block not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/blockchain/transactions/{txHash}:
    get:
      tags: [Blockchain]
      summary: Get transaction by hash
      parameters:
        - name: txHash
          in: path
          required: true
          schema:
            type: string
            pattern: '^0x[a-fA-F0-9]{64}$'
      responses:
        '200':
          description: Transaction retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transaction'

  # Smart Contract Operations
  /api/contracts/deploy:
    post:
      tags: [Smart Contracts]
      summary: Deploy smart contract
      description: Deploy a new smart contract to the blockchain
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContractDeployRequest'
      responses:
        '200':
          description: Contract deployed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContractDeployResponse'
        '400':
          description: Invalid contract code or parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/contracts/call:
    post:
      tags: [Smart Contracts]
      summary: Call contract function
      description: Execute a smart contract function
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContractCallRequest'
      responses:
        '200':
          description: Contract function executed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContractCallResponse'

  /api/contracts/query:
    post:
      tags: [Smart Contracts]
      summary: Query contract state
      description: Query smart contract state without modifying it
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContractQueryRequest'
      responses:
        '200':
          description: Contract state queried successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContractQueryResponse'

  /api/contracts/estimate-gas:
    post:
      tags: [Smart Contracts]
      summary: Estimate gas for contract call
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContractCallRequest'
      responses:
        '200':
          description: Gas estimate calculated
          content:
            application/json:
              schema:
                type: object
                properties:
                  gasEstimate:
                    type: integer
                    description: Estimated gas units required

  # Cross-Chain Bridge
  /api/bridge/networks:
    get:
      tags: [Cross-Chain Bridge]
      summary: List supported networks
      responses:
        '200':
          description: Supported networks listed
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Network'

  /api/bridge/transfer:
    post:
      tags: [Cross-Chain Bridge]
      summary: Initiate cross-chain transfer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BridgeTransferRequest'
      responses:
        '200':
          description: Transfer initiated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BridgeTransferResponse'

  /api/bridge/transfer/{transferId}/status:
    get:
      tags: [Cross-Chain Bridge]
      summary: Get transfer status
      parameters:
        - name: transferId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Transfer status retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransferStatus'

  # Governance
  /api/governance/proposals:
    get:
      tags: [Governance]
      summary: List governance proposals
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [active, pending, executed, defeated]
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: Proposals listed successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Proposal'
    post:
      tags: [Governance]
      summary: Create new proposal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProposalRequest'
      responses:
        '201':
          description: Proposal created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Proposal'

  /api/governance/proposals/{proposalId}/vote:
    post:
      tags: [Governance]
      summary: Vote on proposal
      parameters:
        - name: proposalId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VoteRequest'
      responses:
        '200':
          description: Vote cast successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VoteResponse'

  # Weather Data
  /api/weather/submit:
    post:
      tags: [Weather Data]
      summary: Submit weather data
      description: Submit environmental data from weather stations
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WeatherDataSubmission'
            examples:
              basic_submission:
                summary: Basic weather data submission
                value:
                  stationId: 'station_001'
                  sensorData:
                    - type: 'temperature'
                      value: 23.5
                      unit: 'celsius'
                      status: 'active'
                    - type: 'humidity'
                      value: 65.2
                      unit: 'percent'
                      status: 'active'
                  location:
                    latitude: 40.7128
                    longitude: -74.0060
                    altitude: 10
                  quality:
                    score: 95
                    issues: []
      responses:
        '200':
          description: Weather data submitted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WeatherSubmissionResponse'
              examples:
                successful_submission:
                  summary: Successful weather data submission
                  value:
                    success: true
                    data:
                      stationId: 'station_001'
                      timestamp: '2024-01-15T10:30:00Z'
                      rewards:
                        totalAmount: 0.17
                        baseAmount: 0.1
                        qualityBonus: 0.05
                        proximityBonus: 0.02
                      blockchain:
                        blockNumber: 123456
                        transactionHash: '0x1234567890abcdef...'
                        gasUsed: 21000
                    message: 'Weather data submitted successfully'
                    timestamp: '2024-01-15T10:30:00Z'
        '400':
          description: Invalid weather data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/weather/data:
    get:
      tags: [Weather Data]
      summary: Get weather data
      parameters:
        - name: station_id
          in: query
          schema:
            type: string
        - name: start_date
          in: query
          schema:
            type: string
            format: date-time
        - name: end_date
          in: query
          schema:
            type: string
            format: date-time
        - name: data_type
          in: query
          schema:
            type: string
            enum: [temperature, humidity, pressure, wind, precipitation]
      responses:
        '200':
          description: Weather data retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WeatherData'

  /api/weather/security-status:
    get:
      tags: [Weather Data]
      summary: Get weather security status
      description: Retrieve security status of weather stations and data integrity
      responses:
        '200':
          description: Weather security status retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WeatherSecurityStatus'

  # Mining Operations
  /api/mining/rewards:
    get:
      tags: [Mining]
      summary: Get mining rewards
      description: Retrieve mining rewards for a specific address
      parameters:
        - name: address
          in: query
          description: Wallet address to get rewards for
          schema:
            type: string
            pattern: '^0x[a-fA-F0-9]{40}$'
        - name: type
          in: query
          description: Type of mining reward
          schema:
            type: string
            enum: [weather_data, compute, validation, staking]
        - name: limit
          in: query
          description: Number of rewards to return
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
      responses:
        '200':
          description: Mining rewards retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/MiningReward'
                  message:
                    type: string
                  timestamp:
                    type: string
                    format: date-time

  # Analytics
  /api/analytics:
    get:
      tags: [Analytics]
      summary: Get network analytics
      description: Retrieve comprehensive network analytics and metrics
      responses:
        '200':
          description: Network analytics retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/NetworkAnalytics'
                  message:
                    type: string
                  timestamp:
                    type: string
                    format: date-time

  # Health Check
  /health:
    get:
      tags: [System]
      summary: System health check
      description: Get comprehensive system health status
      responses:
        '200':
          description: System health status retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/HealthStatus'
                  message:
                    type: string
                  timestamp:
                    type: string
                    format: date-time

  /api/health:
    get:
      tags: [System]
      summary: API health check
      description: Get comprehensive API health status
      responses:
        '200':
          description: API health status retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/HealthStatus'
                  message:
                    type: string
                  timestamp:
                    type: string
                    format: date-time

  # Weather Data Export
  /api/v1/export/stations/{stationId}/observations:
    get:
      tags: [Weather Data]
      summary: Export station weather observations
      description: Stream historical weather observations for a station as JSON or CSV.
      parameters:
        - name: stationId
          in: path
          required: true
          description: Station identifier (station_id or device_id fallback)
          schema:
            type: string
        - name: from
          in: query
          description: ISO timestamp lower bound (alias `start` also supported)
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          description: ISO timestamp upper bound (alias `end` also supported)
          schema:
            type: string
            format: date-time
        - name: format
          in: query
          description: Export format
          schema:
            type: string
            enum: [json, csv]
            default: json
      responses:
        '200':
          description: Weather observations streamed successfully
        '400':
          description: Invalid query parameters
        '429':
          description: Rate limit exceeded
        '503':
          description: Database unavailable

  /api/v1/export/region:
    get:
      tags: [Weather Data]
      summary: Export regional weather observations
      description: Stream historical weather observations within a radius around a lat/lon point.
      parameters:
        - name: lat
          in: query
          required: true
          schema:
            type: number
            format: double
            minimum: -90
            maximum: 90
        - name: lon
          in: query
          required: true
          schema:
            type: number
            format: double
            minimum: -180
            maximum: 180
        - name: radius_km
          in: query
          required: true
          schema:
            type: number
            format: double
            minimum: 0.1
            maximum: 1000
        - name: from
          in: query
          description: ISO timestamp lower bound (alias `start` also supported)
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          description: ISO timestamp upper bound (alias `end` also supported)
          schema:
            type: string
            format: date-time
        - name: format
          in: query
          schema:
            type: string
            enum: [json, csv]
            default: json
      responses:
        '200':
          description: Regional weather observations streamed successfully
        '400':
          description: Invalid query parameters
        '429':
          description: Rate limit exceeded
        '503':
          description: Database unavailable

  /api/v1/data-catalog:
    get:
      tags: [Weather Data]
      summary: Get weather data catalog
      description: List stations with available observation ranges and data availability metadata.
      parameters:
        - name: limit
          in: query
          description: Maximum number of stations to include
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 100
      responses:
        '200':
          description: Data catalog returned successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      stations:
                        type: array
                        items:
                          type: object
                          properties:
                            stationId:
                              type: string
                              nullable: true
                            firstObservationAt:
                              type: string
                              format: date-time
                              nullable: true
                            lastObservationAt:
                              type: string
                              format: date-time
                              nullable: true
                            observationsCount:
                              type: number
                              nullable: true
                            averageQualityScore:
                              type: number
                              nullable: true
                      total:
                        type: integer
                  timestamp:
                    type: string
                    format: date-time
        '400':
          description: Invalid query parameters
        '503':
          description: Database unavailable

  /api/v1/stations/discover:
    post:
      tags: [Weather Data]
      summary: Discover weather stations for provisioning
      description: >
        Triggers a station scan for Ecowitt gateways on local network targets and
        optional Ambient/Davis cloud account discovery.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                localSubnet:
                  type: string
                  description: Optional subnet prefix such as 192.168.1.0/24
                ecowittHosts:
                  type: array
                  description: Optional explicit Ecowitt gateway hosts to probe
                  items:
                    type: string
                ambient:
                  type: object
                  properties:
                    apiKey:
                      type: string
                    applicationKey:
                      type: string
                davis:
                  type: object
                  properties:
                    apiKey:
                      type: string
      responses:
        '200':
          description: Discovery completed
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      discoveredStations:
                        type: array
                        items:
                          type: object
                          properties:
                            stationId:
                              type: string
                            stationType:
                              type: string
                              enum: [ecowitt, ambient, davis]
                            source:
                              type: string
                            model:
                              type: string
                              nullable: true
                            macAddress:
                              type: string
                              nullable: true
                            firmwareVersion:
                              type: string
                              nullable: true
                            discoveredAt:
                              type: string
                              format: date-time
                      totalsByType:
                        type: object
                      total:
                        type: integer
                  timestamp:
                    type: string
                    format: date-time
        '429':
          description: Rate limit exceeded (max 1 scan per minute per IP)
        '503':
          description: Database unavailable

  /api/v1/stations/provision:
    post:
      tags: [Weather Data]
      summary: Provision a discovered station
      description: >
        Registers and configures a station in the persistent IoT device registry
        and returns an auth token for station data submissions.
      parameters:
        - name: Authorization
          in: header
          required: false
          description: Bearer operator/contributor token when token auth is enabled
          schema:
            type: string
        - name: x-wrfcoin-operator-token
          in: header
          required: false
          description: Operator token header alternative
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - stationType
                - ownerAddress
                - connection
              properties:
                stationType:
                  type: string
                  enum: [ecowitt, ambient, davis]
                stationId:
                  type: string
                ownerAddress:
                  type: string
                pollingIntervalSeconds:
                  type: integer
                model:
                  type: string
                macAddress:
                  type: string
                firmwareVersion:
                  type: string
                connection:
                  type: object
                  properties:
                    host:
                      type: string
                    ip:
                      type: string
                    apiKey:
                      type: string
                    applicationKey:
                      type: string
                    stationUuid:
                      type: string
      responses:
        '200':
          description: Station provisioned successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      stationId:
                        type: string
                      stationType:
                        type: string
                      ownerAddress:
                        type: string
                      pollingIntervalSeconds:
                        type: integer
                      authToken:
                        type: string
                      tokenType:
                        type: string
                      tokenIssuedAt:
                        type: string
                        format: date-time
                      status:
                        type: string
                  timestamp:
                    type: string
                    format: date-time
        '400':
          description: Invalid provisioning payload
        '401':
          description: Missing or invalid operator token
        '503':
          description: Database unavailable

  /api/v1/stations/{stationId}/verify:
    post:
      tags: [Weather Data]
      summary: Verify station first-reading status
      description: >
        Verifies whether a station has submitted at least one valid weather reading.
        Returns `verified`, `pending`, or `failed` and re-activates station on successful verification.
      parameters:
        - name: stationId
          in: path
          required: true
          schema:
            type: string
        - name: Authorization
          in: header
          required: false
          description: Bearer operator token or station auth token
          schema:
            type: string
        - name: x-station-auth-token
          in: header
          required: false
          description: Station auth token from provisioning response
          schema:
            type: string
      responses:
        '200':
          description: Verification status returned successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      stationId:
                        type: string
                      stationType:
                        type: string
                      verificationStatus:
                        type: string
                        enum: [verified, pending, failed]
                      verificationTimestamp:
                        type: string
                        format: date-time
                      totalReadings:
                        type: integer
                      validReadings:
                        type: integer
                      firstReadingAt:
                        type: string
                        format: date-time
                        nullable: true
                      lastReadingAt:
                        type: string
                        format: date-time
                        nullable: true
                      isActive:
                        type: boolean
                  timestamp:
                    type: string
                    format: date-time
        '400':
          description: Invalid station id
        '401':
          description: Missing or invalid auth token
        '404':
          description: Station not found

  /api/v1/stations/{stationId}:
    delete:
      tags: [Weather Data]
      summary: Decommission a station
      description: >
        Soft-decommissions a station by setting `is_active=false` and recording `decommissioned_at`.
      parameters:
        - name: stationId
          in: path
          required: true
          schema:
            type: string
        - name: Authorization
          in: header
          required: false
          description: Bearer operator token or station auth token
          schema:
            type: string
        - name: x-station-auth-token
          in: header
          required: false
          description: Station auth token from provisioning response
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
      responses:
        '200':
          description: Station decommissioned successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      stationId:
                        type: string
                      stationType:
                        type: string
                      ownerAddress:
                        type: string
                      status:
                        type: string
                      isActive:
                        type: boolean
                      decommissionedAt:
                        type: string
                        format: date-time
                      decommissionedBy:
                        type: string
                      reason:
                        type: string
                      finalStatus:
                        type: object
                        properties:
                          totalReadings:
                            type: number
                            nullable: true
                          lastReadingAt:
                            type: string
                            format: date-time
                            nullable: true
                          averageQualityScore24h:
                            type: number
                            nullable: true
                  timestamp:
                    type: string
                    format: date-time
        '400':
          description: Invalid station id
        '401':
          description: Missing or invalid auth token
        '404':
          description: Station not found

  /api/v1/stations/status:
    get:
      tags: [Weather Data]
      summary: Get provisioned station health
      description: >
        Returns data-flow and health status for provisioned Ecowitt, Ambient, and Davis stations.
      parameters:
        - name: ownerAddress
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Provisioned station health returned successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      stations:
                        type: array
                        items:
                          type: object
                          properties:
                            stationId:
                              type: string
                            stationType:
                              type: string
                            ownerAddress:
                              type: string
                            model:
                              type: string
                              nullable: true
                            lastReadingAt:
                              type: string
                              format: date-time
                              nullable: true
                            connectionStatus:
                              type: string
                              enum: [online, stale, offline, never_seen]
                            dataFlowing:
                              type: boolean
                            dataQualityScore24h:
                              type: number
                              nullable: true
                      summary:
                        type: object
                      asOf:
                        type: string
                        format: date-time
                  timestamp:
                    type: string
                    format: date-time
        '503':
          description: Database unavailable

