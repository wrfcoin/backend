  # Compute Operations
  /api/compute/tasks:
    post:
      tags: [Compute]
      summary: Submit compute task
      description: Submit a distributed computing task to the network
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                taskType:
                  type: string
                  enum:
                    [
                      machine-learning,
                      data-processing,
                      scientific-computation,
                      rendering,
                    ]
                  description: Type of compute task
                priority:
                  type: string
                  enum: [low, medium, high, urgent]
                  description: Task priority level
                resourceRequirements:
                  type: object
                  properties:
                    cpu:
                      type: integer
                      description: CPU cores required
                    memory:
                      type: integer
                      description: Memory in GB
                    storage:
                      type: integer
                      description: Storage in GB
                    gpu:
                      type: boolean
                      description: GPU requirement
              required:
                - taskType
            examples:
              ml_task:
                summary: Machine learning task
                value:
                  taskType: 'machine-learning'
                  priority: 'high'
                  resourceRequirements:
                    cpu: 8
                    memory: 32
                    storage: 100
                    gpu: true
      responses:
        '200':
          description: Task submitted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  taskId:
                    type: string
                  status:
                    type: string
                    enum: [queued, running, completed, failed]
                  assignedProvider:
                    type: string
                  estimatedCompletion:
                    type: string
                  cost:
                    type: string
                  queuePosition:
                    type: integer
        '400':
          description: Invalid task request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

