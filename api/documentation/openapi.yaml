                $ref: '#/components/schemas/SuccessResponse'

  /api/kpi/integrity:
    get:
      tags: [Alignment KPIs]
      summary: Get data integrity KPI
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Integrity KPI
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'

  /api/kpi/summary:
    get:
      tags: [Alignment KPIs]
      summary: Get overall KPI summary
      security:
        - BearerAuth: []
      responses:
        '200':
          description: KPI summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'

  # OpenForis Integration — Issue #393
  /api/openforis/health:
    get:
      tags: [OpenForis]
      summary: Get OpenForis health status
      responses:
        '200':
          description: OpenForis health
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'

  /api/openforis/surveys:
    get:
      tags: [OpenForis]
      summary: List OpenForis surveys
      security:
        - BearerAuth: []
      responses:
        '200':
          description: List of surveys
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'

  /api/openforis/records:
    post:
      tags: [OpenForis]
      summary: Submit an OpenForis record
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                surveyId:
                  type: string
                data:
                  type: object
      responses:
        '201':
          description: Record submitted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'

  # Incident Automation — Issue #393
  /api/incident-automation/incidents:
    get:
      tags: [Incident Automation]
      summary: List automated incidents
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Incident list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
    post:
      tags: [Incident Automation]
      summary: Create a synthetic incident
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                type:
                  type: string
                severity:
                  type: string
      responses:
        '201':
          description: Incident created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'

  /api/incident-automation/incidents/{id}/resolve:
    post:
      tags: [Incident Automation]
      summary: Resolve an incident
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Incident resolved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'

  # Wallet Auth — Issue #393
  /api/wallet-auth/nonce/{address}:
    get:
      tags: [Wallet Auth]
      summary: Get nonce for wallet authentication
      parameters:
        - name: address
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Authentication nonce
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'

  /api/wallet-auth/verify:
    post:
      tags: [Wallet Auth]
      summary: Verify wallet signature and issue JWT
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [address, signature, nonce]
              properties:
                address:
                  type: string
                signature:
                  type: string
                nonce:
                  type: string
      responses:
        '200':
          description: Authentication successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'

  /api/wallet-auth/wallets:
    get:
      tags: [Wallet Auth]
      summary: List authenticated wallets for current user
      security:
        - BearerAuth: []
      responses:
        '200':
          description: List of wallets
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
        timestamp:
          type: string
          format: date-time
      required: [success]

    Error:
      type: object
      properties:
        error:
          type: string
          description: Error message
        code:
          type: string
          description: Error code
        details:
          type: object
          description: Additional error details
        timestamp:
          type: string
          format: date-time
      required: [error, code]

    FileIntegrityGenerateHashesRequest:
      type: object
      properties:
        fileId:
          type: string
          format: uuid
        algorithms:
          type: array
          minItems: 1
          items:
            type: string
            enum: [SHA256, SHA512, BLAKE2B]
      required: [fileId, algorithms]

    FileIntegrityHashResult:
      type: object
      properties:
        algorithm:
          type: string
          enum: [SHA256, SHA512, BLAKE2B]
        hash:
          type: string
        size:
          type: integer
        generatedAt:
          type: string
          format: date-time
        verificationTime:
          type: integer
      required: [algorithm, hash, size, generatedAt, verificationTime]

    FileIntegrityGenerateHashesResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          properties:
            fileId:
              type: string
              format: uuid
            filename:
              type: string
            size:
              type: integer
            hashes:
              type: array
              items:
                $ref: '#/components/schemas/FileIntegrityHashResult'
            generatedAt:
              type: string
              format: date-time
            totalTime:
              type: integer
          required: [fileId, filename, size, hashes, generatedAt, totalTime]
      required: [success, data]

    FileIntegrityUnsupportedHashError:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          type: string
          example: Unsupported hash algorithm requested. Supported algorithms are SHA256, SHA512, and BLAKE2B.
        code:
          type: string
          enum: [UNSUPPORTED_HASH_ALGORITHM]
        details:
          type: object
          properties:
            disallowedAlgorithms:
              type: array
              items:
                type: string
            allowedAlgorithms:
              type: array
              items:
                type: string
                enum: [SHA256, SHA512, BLAKE2B]
          required: [disallowedAlgorithms, allowedAlgorithms]
      required: [success, error, code, details]

    BlockchainStatus:
      type: object
      properties:
        blockHeight:
          type: integer
          description: Current block height
        lastBlockHash:
          type: string
          description: Hash of the most recent block
        networkHashRate:
          type: number
          description: Network hash rate in H/s
        difficulty:
          type: number
          description: Current mining difficulty
        consensusState:
          type: string
          enum: [healthy, degraded, failed]
        peerCount:
          type: integer
          description: Number of connected peers
        syncStatus:
          type: string
          enum: [synced, syncing, out_of_sync]
        uptimeSeconds:
          type: integer
          description: Node uptime in seconds

    Block:
      type: object
      properties:
        hash:
          type: string
          description: Block hash
        index:
          type: integer
          description: Block number
        previousHash:
          type: string
          description: Previous block hash
        timestamp:
          type: integer
          description: Block timestamp
        merkleRoot:
          type: string
          description: Merkle root of transactions
        nonce:
          type: integer
          description: Mining nonce
        difficulty:
          type: number
          description: Block difficulty
        transactionCount:
          type: integer
          description: Number of transactions in block
        size:
          type: integer
          description: Block size in bytes
        gasUsed:
          type: integer
          description: Total gas used in block
        gasLimit:
          type: integer
          description: Block gas limit

    Transaction:
      type: object
      properties:
        hash:
          type: string
          description: Transaction hash
        from:
          type: string
          description: Sender address
        to:
          type: string
          description: Recipient address
        value:
          type: string
          description: Transaction value in wei
        gas:
          type: integer
          description: Gas limit
        gasPrice:
          type: string
          description: Gas price in wei
        gasUsed:
          type: integer
          description: Gas used
        nonce:
          type: integer
          description: Transaction nonce
        blockHash:
          type: string
          description: Block hash containing transaction
        blockNumber:
          type: integer
          description: Block number
        transactionIndex:
          type: integer
          description: Transaction index in block
        status:
          type: string
          enum: [pending, confirmed, failed]
        timestamp:
          type: integer
          description: Transaction timestamp

    ContractDeployRequest:
      type: object
      properties:
        contractCode:
          type: string
          description: Base64 encoded WASM contract code
        constructorArgs:
          type: array
          items:
            type: string
          description: Constructor arguments
        gasLimit:
          type: integer
          description: Gas limit for deployment
        gasPrice:
          type: string
          description: Gas price in wei
      required: [contractCode, gasLimit, gasPrice]

    ContractDeployResponse:
      type: object
      properties:
        contractAddress:
          type: string
          description: Deployed contract address
        transactionHash:
          type: string
          description: Deployment transaction hash
        gasUsed:
          type: integer
          description: Gas used for deployment

    ContractCallRequest:
      type: object
      properties:
        contractAddress:
          type: string
          description: Contract address
        functionName:
          type: string
          description: Function to call
        parameters:
          type: array
          items: {}
          description: Function parameters
        gasLimit:
          type: integer
          description: Gas limit
        gasPrice:
          type: string
          description: Gas price in wei
        value:
          type: string
          description: ETH value to send (optional)
          default: '0'
      required: [contractAddress, functionName, gasLimit, gasPrice]

    ContractCallResponse:
      type: object
      properties:
        transactionHash:
          type: string
          description: Transaction hash
        gasUsed:
          type: integer
          description: Gas used
        logs:
          type: array
          items:
            type: object
          description: Event logs emitted

    ContractQueryRequest:
      type: object
      properties:
        contractAddress:
          type: string
          description: Contract address
        functionName:
          type: string
          description: Function to query
        parameters:
          type: array
          items: {}
          description: Function parameters
      required: [contractAddress, functionName]

    ContractQueryResponse:
      type: object
      properties:
        result:
          description: Function return value
        gasEstimate:
          type: integer
          description: Estimated gas for this call

    Network:
      type: object
      properties:
        name:
          type: string
          description: Network name
        chainId:
          type: integer
          description: Chain ID
        rpcUrl:
          type: string
          description: RPC endpoint URL
        explorerUrl:
          type: string
          description: Block explorer URL
        isActive:
          type: boolean
          description: Whether network is active
        supportedTokens:
          type: array
          items:
            type: string
          description: Supported token addresses

    BridgeTransferRequest:
      type: object
      properties:
        sourceChain:
          type: string
          description: Source blockchain
        destinationChain:
          type: string
          description: Destination blockchain
        tokenAddress:
          type: string
          description: Token contract address
        amount:
          type: string
          description: Amount to transfer
        sender:
          type: string
          description: Sender address
        recipient:
          type: string
          description: Recipient address
        nonce:
          type: integer
          description: Transfer nonce
      required: [sourceChain, destinationChain, amount, sender, recipient]

    BridgeTransferResponse:
      type: object
      properties:
        transferId:
          type: string
          description: Unique transfer ID
        status:
          type: string
          enum: [initiated, verified, processing, completed, failed]
        transactionHash:
          type: string
          description: Initial transaction hash
        estimatedCompletion:
          type: integer
          description: Estimated completion time in seconds

    TransferStatus:
      type: object
      properties:
        transferId:
          type: string
        status:
          type: string
          enum: [initiated, verified, processing, completed, failed]
        confirmations:
          type: integer
          description: Number of confirmations
        estimatedCompletion:
          type: integer
          description: Estimated completion time
        sourceTransactionHash:
          type: string
        destinationTransactionHash:
          type: string

    Proposal:
      type: object
      properties:
        id:
          type: string
          description: Proposal ID
        title:
          type: string
          description: Proposal title
        description:
          type: string
          description: Proposal description
        proposer:
          type: string
          description: Proposer address
        status:
          type: string
          enum: [active, pending, executed, defeated, expired]
        votesFor:
          type: string
          description: Total votes in favor
        votesAgainst:
          type: string
          description: Total votes against
        votesAbstain:
          type: string
          description: Total abstain votes
        startTime:
          type: integer
          description: Voting start timestamp
        endTime:
          type: integer
          description: Voting end timestamp
        executionTime:
          type: integer
          description: Execution timestamp (if applicable)
        quorum:
          type: string
          description: Required quorum
        threshold:
          type: string
          description: Approval threshold

    CreateProposalRequest:
      type: object
      properties:
        title:
          type: string
          description: Proposal title
        description:
          type: string
          description: Proposal description
        actions:
          type: array
          items:
            type: object
          description: Actions to execute if passed
        votingPeriod:
          type: integer
          description: Voting period in seconds
      required: [title, description, actions, votingPeriod]

    VoteRequest:
      type: object
      properties:
        vote:
          type: string
          enum: [for, against, abstain]
        votingPower:
          type: string
          description: Voting power to use
        reason:
          type: string
          description: Optional voting reason
      required: [vote]

    VoteResponse:
      type: object
      properties:
        transactionHash:
          type: string
          description: Vote transaction hash
        votingPower:
          type: string
          description: Voting power used
        timestamp:
          type: integer
          description: Vote timestamp

    WeatherDataSubmission:
      type: object
      properties:
        stationId:
          type: string
          description: Weather station identifier
          example: 'station_001'
        timestamp:
          type: integer
          description: Data collection timestamp
          example: 1706188800
        location:
          $ref: '#/components/schemas/Location'
        measurements:
          type: array
          items:
            $ref: '#/components/schemas/WeatherMeasurement'
        signature:
          type: string
          description: Data integrity signature
          example: '0x1234567890abcdef...'
        sensorData:
          type: array
          description: Array of sensor readings
          items:
            type: object
            properties:
              type:
                type: string
                enum:
                  [
                    temperature,
                    humidity,
                    pressure,
                    wind_speed,
                    wind_direction,
                    precipitation,
                    visibility,
                    uv_index,
                  ]
                example: 'temperature'
              value:
                type: number
                description: Sensor reading value
                example: 23.5
              unit:
                type: string
                description: Unit of measurement
                example: 'celsius'
              status:
                type: string
                enum: [active, inactive, error]
                example: 'active'
        quality:
          type: object
          properties:
            score:
              type: number
              minimum: 0
              maximum: 100
              description: Data quality score
              example: 95
            issues:
              type: array
              items:
                type: string
              description: Quality issues detected
              example: []
      required: [stationId, sensorData]

    WeatherSubmissionResponse:
      type: object
      properties:
        success:
          type: boolean
          description: Whether the submission was successful
          example: true
        data:
          type: object
          properties:
            stationId:
              type: string
              description: Weather station identifier
              example: 'station_001'
            timestamp:
              type: string
              format: date-time
              description: Submission timestamp
              example: '2024-01-15T10:30:00Z'
            location:
              $ref: '#/components/schemas/Location'
            sensors:
              type: array
              items:
                type: object
                properties:
                  type:
                    type: string
                    example: 'temperature'
                  value:
                    type: number
                    example: 23.5
                  unit:
                    type: string
                    example: 'celsius'
                  status:
                    type: string
                    example: 'active'
            quality:
              type: object
              properties:
                score:
                  type: number
                  example: 85
                issues:
                  type: array
                  items:
                    type: string
                  example: []
                validated:
                  type: boolean
                  example: true
            rewards:
              type: object
              properties:
                baseAmount:
                  type: number
                  description: Base reward amount
                  example: 0.1
                qualityBonus:
                  type: number
                  description: Quality bonus amount
                  example: 0.05
                proximityBonus:
                  type: number
                  description: Proximity bonus amount
                  example: 0.02
                totalAmount:
                  type: number
                  description: Total reward amount
                  example: 0.17
            blockchain:
              type: object
              properties:
                blockNumber:
                  type: integer
                  description: Block number where transaction was included
                  example: 123456
                transactionHash:
                  type: string
                  description: Transaction hash
                  example: '0x1234567890abcdef...'
                gasUsed:
                  type: integer
                  description: Gas used for transaction
                  example: 21000
        message:
          type: string
          description: Response message
          example: 'Weather data submitted successfully'
        timestamp:
          type: string
          format: date-time
          description: Response timestamp
          example: '2024-01-15T10:30:00Z'

    WeatherData:
      type: object
      properties:
        id:
          type: string
        stationId:
          type: string
        timestamp:
          type: integer
        location:
          $ref: '#/components/schemas/Location'
        measurement:
          $ref: '#/components/schemas/WeatherMeasurement'
        qualityScore:
          type: number
        rewardAmount:
          type: string

    Location:
      type: object
      properties:
        latitude:
          type: number
          description: Latitude in decimal degrees
          minimum: -90
          maximum: 90
          example: 40.7128
        longitude:
          type: number
          description: Longitude in decimal degrees
          minimum: -180
          maximum: 180
          example: -74.0060
        altitude:
          type: number
          description: Altitude in meters
          example: 10
        accuracy:
          type: number
          description: Location accuracy in meters
          minimum: 0
          example: 5
      required: [latitude, longitude]

    WeatherMeasurement:
      type: object
      properties:
        type:
          type: string
          enum:
            [
              temperature,
              humidity,
              pressure,
              wind_speed,
              wind_direction,
              precipitation,
              visibility,
              uv_index,
            ]
        value:
          type: number
          description: Measurement value
        unit:
          type: string
          description: Unit of measurement
        uncertainty:
          type: number
          description: Measurement uncertainty
      required: [type, value, unit]

    HardwareDevice:
      type: object
      properties:
        deviceId:
          type: string
          description: Unique device identifier
        deviceType:
          type: string
          enum: [ledger, trezor, yubihsm, secure_enclave, pkcs11]
        deviceName:
          type: string
          description: Human-readable device name
        firmwareVersion:
          type: string
          description: Device firmware version
        isConnected:
          type: boolean
          description: Connection status
        isAuthenticated:
          type: boolean
          description: Authentication status
        supportedFeatures:
          type: array
          items:
            type: string
          description: List of supported features

    HardwareSignRequest:
      type: object
      properties:
        deviceId:
          type: string
          description: Hardware device ID
        transactionHash:
          type: string
          description: Transaction hash to sign
        derivationPath:
          type: string
          description: BIP32 derivation path
        displayOnDevice:
          type: boolean
          description: Show transaction on device screen
          default: true
        requireConfirmation:
          type: boolean
          description: Require user confirmation
          default: true
      required: [deviceId, transactionHash, derivationPath]

    HardwareSignResponse:
      type: object
      properties:
        signature:
          type: string
          description: Transaction signature
        publicKey:
          type: string
          description: Public key used for signing
        deviceConfirmed:
          type: boolean
          description: Whether user confirmed on device
        timestamp:
          type: integer
          description: Signing timestamp

    # Mining and Rewards
    MiningReward:
      type: object
      properties:
        id:
          type: string
          description: Unique reward identifier
        recipient:
          type: string
          description: Recipient wallet address
        type:
          type: string
          enum: [weather_data, compute, validation, staking]
          description: Type of mining reward
        amount:
          type: number
          description: Reward amount
        currency:
          type: string
          description: Currency symbol
        source:
          type: object
          properties:
            type:
              type: string
            id:
              type: string
            details:
              type: object
        multipliers:
          type: object
          properties:
            base:
              type: number
            quality:
              type: number
            proximity:
              type: number
            frequency:
              type: number
            total:
              type: number
        performance:
          type: object
          properties:
            uptime:
              type: number
            accuracy:
              type: number
            speed:
              type: number
        blockchain:
          type: object
          properties:
            blockNumber:
              type: integer
            transactionHash:
              type: string
            gasUsed:
              type: integer
            confirmations:
              type: integer
        timestamp:
          type: string
          format: date-time
        status:
          type: string
          enum: [pending, confirmed, failed]

    # Analytics
    NetworkAnalytics:
      type: object
      properties:
        overview:
          type: object
          properties:
            totalUsers:
              type: integer
            activeUsers24h:
              type: integer
            totalTransactions:
              type: integer
            totalValueLocked:
              type: number
            networkUtilization:
              type: number
        performance:
          type: object
          properties:
            averageResponseTime:
              type: number
            throughput:
              type: number
            errorRate:
              type: number
            uptime:
              type: number
        security:
          type: object
          properties:
            threatLevel:
              type: string
              enum: [low, medium, high, critical]
            activeThreats:
              type: integer
            blockedAttacks:
              type: integer
            securityScore:
              type: number
        crossChain:
          type: object
          properties:
            supportedChains:
              type: integer
            activeBridges:
              type: integer
            bridgeVolume24h:
              type: number
            bridgeSuccessRate:
              type: number
        weather:
          type: object
          properties:
            activeStations:
              type: integer
            dataSubmissions24h:
              type: integer
            averageQuality:
              type: number
            rewardsDistributed24h:
              type: number

    # System Health
    HealthStatus:
      type: object
      properties:
        status:
          type: string
          enum: [healthy, degraded, unhealthy]
        timestamp:
          type: string
          format: date-time
        uptime:
          type: number
        version:
          type: string
        environment:
          type: string
        services:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              status:
                type: string
              responseTime:
                type: number
              errorRate:
                type: number
              lastCheck:
                type: string
                format: date-time
              dependencies:
                type: array
                items:
                  type: string
        database:
          type: object
          properties:
            status:
              type: string
            connectionPool:
              type: object
              properties:
                total:
                  type: integer
                active:
                  type: integer
                idle:
                  type: integer
            queryPerformance:
              type: object
              properties:
                averageTime:
                  type: number
                slowQueries:
                  type: integer
            storage:
              type: object
              properties:
                used:
                  type: integer
                available:
                  type: integer
                utilization:
                  type: number
        blockchain:
          type: object
          properties:
            status:
              type: string
            nodeConnection:
              type: boolean
            syncStatus:
              type: string
            blocksBehind:
              type: integer
            lastBlockTime:
              type: string
              format: date-time
            networkLatency:
              type: number
        performance:
          type: object
          properties:
            cpu:
              type: object
              properties:
                usage:
                  type: number
                loadAverage:
                  type: array
                  items:
                    type: number
            memory:
              type: object
              properties:
                used:
                  type: integer
                available:
                  type: integer
                utilization:
                  type: number
            disk:
              type: object
              properties:
                used:
                  type: integer
                available:
                  type: integer
                utilization:
                  type: number
            network:
              type: object
              properties:
                bytesIn:
                  type: integer
                bytesOut:
                  type: integer
                packetsIn:
                  type: integer
                packetsOut:
                  type: integer
        security:
          type: object
          properties:
            status:
              type: string
            lastSecurityScan:
              type: string
              format: date-time
            vulnerabilities:
              type: object
              properties:
                critical:
                  type: integer
                high:
                  type: integer
                medium:
                  type: integer
                low:
                  type: integer
            certificates:
              type: object
              properties:
                valid:
                  type: boolean
                expiresAt:
                  type: string
                  format: date-time
                grade:
                  type: string
            firewall:
              type: object
              properties:
                active:
                  type: boolean
                rules:
                  type: integer
                blockedConnections24h:
                  type: integer

    # Security
    SecurityStats:
      type: object
      properties:
        totalEvents:
          type: integer
        threatLevel:
          type: string
          enum: [low, medium, high, critical]
        activeThreatCount:
          type: integer
        blockedAttacks24h:
          type: integer
        securityScore:
          type: number
        lastUpdated:
          type: string
          format: date-time

    # Compliance
    ComplianceStatus:
      type: object
      properties:
        overall_score:
          type: number
          description: Overall compliance score
        gdpr_compliance:
          type: boolean
          description: GDPR compliance status
        iso27001_status:
          type: string
          description: ISO 27001 certification status
        last_audit:
          type: string
          format: date
          description: Last audit date
        next_audit:
          type: string
          format: date
          description: Next audit date
        certifications:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              status:
                type: string
              expires:
                type: string
                format: date
              last_review:
                type: string
                format: date
        data_protection:
          type: object
          properties:
            encryption_at_rest:
              type: boolean
            encryption_in_transit:
              type: boolean
            backup_encryption:
              type: boolean
            access_logging:
              type: boolean
            data_retention_policy:
              type: boolean
            right_to_deletion:
              type: boolean
            consent_management:
              type: boolean
        policy_compliance:
          type: number
        violations:
          type: integer
        remediation_tasks:
          type: integer

    # Weather Security
    WeatherSecurityStatus:
      type: object
      properties:
        station_security:
          type: string
          enum: [secure, warning, compromised]
        data_integrity:
          type: number
        transmission_encrypted:
          type: boolean
        last_security_check:
          type: string
          format: date-time
        active_stations:
          type: integer
        secure_stations:
          type: integer
        flagged_stations:
          type: integer
        authentication_status:
          type: string
        api_security:
          type: object
          properties:
            rate_limiting:
              type: boolean
            ddos_protection:
              type: boolean
            ssl_grade:
              type: string
            certificate_valid:
              type: boolean
        data_validation:
          type: object
          properties:
            sensor_checks:
              type: boolean
            anomaly_detection:
              type: boolean
            data_sanitization:
              type: boolean
            backup_verification:
              type: boolean

    # Cross-Chain Transfer
    CrossChainTransferRequest:
      type: object
      properties:
        fromChain:
          type: string
          description: Source blockchain network
        toChain:
          type: string
          description: Destination blockchain network
        fromAddress:
          type: string
          description: Source wallet address
        toAddress:
          type: string
          description: Destination wallet address
        amount:
          type: string
          description: Transfer amount
        assetType:
          type: string
          enum: [TOKEN, NFT, NATIVE]
          description: Type of asset being transferred
        assetId:
          type: string
          description: Asset identifier
      required:
        - fromChain
        - toChain
        - fromAddress
        - toAddress
        - amount

    CrossChainTransfer:
      type: object
      properties:
        id:
          type: string
          description: Unique transfer identifier
        sourceChain:
          type: string
          description: Source blockchain network
        targetChain:
          type: string
          description: Target blockchain network
        senderAddress:
          type: string
          description: Sender wallet address
        recipientAddress:
          type: string
          description: Recipient wallet address
        assetType:
          type: string
          enum: [TOKEN, NFT, NATIVE]
        assetId:
          type: string
          description: Asset identifier
        amount:
          type: number
          description: Transfer amount
        status:
          type: string
          enum: [PENDING, PROCESSING, COMPLETED, FAILED]
        bridgeId:
          type: string
          description: Bridge identifier
        transferFee:
          type: number
          description: Transfer fee
        estimatedTime:
          type: integer
          description: Estimated completion time in minutes
        confirmations:
          type: object
          properties:
            required:
              type: integer
            current:
              type: integer
        transactions:
          type: object
          description: Transaction hashes for each step
        timestamp:
          type: string
          format: date-time

    # LangChain Integration
    LangChainStatus:
      type: object
      properties:
        enabled:
          type: boolean
        available:
          type: boolean
        analytics:
          type: object
          properties:
            networkHealth:
              type: string
            recommendations:
              type: integer
        description:
          type: string
        independence:
          type: string

    LangChainInsight:
      type: object
      properties:
        type:
          type: string
        value:
          type: string
        trend:
          type: string
          enum: [low, medium, high]
        recommendation:
          type: string

    Pagination:
      type: object
      properties:
        limit:
          type: integer
          description: Items per page
        offset:
          type: integer
          description: Items to skip
        total:
          type: integer
          description: Total number of items
        hasNext:
          type: boolean
          description: Whether there are more items
        hasPrevious:
          type: boolean
          description: Whether there are previous items

  responses:
    Unauthorized:
      description: Authentication required
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
                example: Token required
              code:
                type: string
                example: UNAUTHORIZED
    Forbidden:
      description: Insufficient permissions
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
                example: Insufficient permissions
              code:
                type: string
                example: FORBIDDEN
    InternalError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ValidationError:
      description: Request validation failed
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
                example: false
              error:
                type: string
              code:
                type: string
                example: VALIDATION_ERROR
              details:
                type: array
                items:
                  type: object
                  properties:
                    field:
                      type: string
                    message:
                      type: string
