# Redis configuration for WRFCoin API caching
# Optimized for performance and memory efficiency

# Basic settings
port 6379
bind 127.0.0.1
timeout 300
tcp-keepalive 60

# Memory management
maxmemory 256mb
# SECURITY (wrfcoin/core4#1203): JWT revocation keys in this Redis must survive
# sustained cache pressure. Under `allkeys-lru` the eviction policy is free to
# drop any key — including `jwt:revoked:*` and `revoked:jwt:*` — which silently
# un-revokes JWTs that an operator thought had been blacklisted. Every Redis
# key that MUST survive (JWT revocations, sessions) is written with an EXPIRE
# by the application layer, so `volatile-lru` evicts only ephemeral cache
# entries with TTLs while leaving revocation keys untouched until their own
# TTL fires. See backend/__tests__/auth-revocation-redis-eviction.test.ts for
# the regression test that locks this invariant in.
maxmemory-policy volatile-lru
maxmemory-samples 5

# Persistence (disabled for cache-only usage)
save ""
appendonly no

# Performance optimizations
tcp-backlog 511
databases 16
hash-max-ziplist-entries 512
hash-max-ziplist-value 64
list-max-ziplist-size -2
list-compress-depth 0
set-max-intset-entries 512
zset-max-ziplist-entries 128
zset-max-ziplist-value 64
hll-sparse-max-bytes 3000

# Security - Enhanced Redis Authentication
protected-mode yes
# Password will be set via environment variable REDIS_PASSWORD
# requirepass will be set via command line --requirepass argument
# Disable dangerous commands in production
rename-command FLUSHDB ""
rename-command FLUSHALL ""
rename-command KEYS ""
rename-command SHUTDOWN SHUTDOWN_b6c89012e4e91c7b7e8e9c8e8f8e8e8e
rename-command CONFIG CONFIG_b6c89012e4e91c7b7e8e9c8e8f8e8e8e
rename-command DEBUG ""
rename-command EVAL ""
rename-command SCRIPT ""

# Network security
bind 127.0.0.1 ::1
# Allow only internal network access when using Docker
# bind 0.0.0.0 is used with Docker networks for internal access only

# Logging
loglevel notice
logfile /var/log/redis/redis-server.log

# Advanced
client-output-buffer-limit normal 0 0 0
client-output-buffer-limit replica 256mb 64mb 60
client-output-buffer-limit pubsub 32mb 8mb 60

# Latency optimizations
latency-monitor-threshold 100
hz 10
