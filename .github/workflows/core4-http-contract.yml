name: Core4 HTTP contract (main and manual)
on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  core4-http-contract:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    # GitHub-hosted and free on this public repo. No trigger here runs fork code,
    # and the job uses no secrets: core4 is public, so it clones anonymously.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      RUSTC_WRAPPER: ''
    steps:
      - uses: actions/checkout@v4
      # Outside the backend workspace so Jest never crawls the core4 tree.
      - name: Check out core4 main
        id: core4
        run: |
          set -euo pipefail
          core4_dir="$RUNNER_TEMP/core4-contract"
          git clone --quiet --depth 1 --branch main https://github.com/wrfcoin/core4 "$core4_dir"
          sha="$(git -C "$core4_dir" rev-parse HEAD)"
          echo "core4 main: $sha"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "CORE4_DIR=$core4_dir" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ runner.temp }}/core4-contract/target
          key: core4-launch-api-${{ runner.os }}-${{ steps.core4.outputs.sha }}
          restore-keys: core4-launch-api-${{ runner.os }}-
      - name: Install backend dependencies
        # onnxruntime-node's postinstall otherwise downloads a ~238 MB GPU package.
        # The runners have no GPU; the CPU runtime ships inside the npm package.
        env:
          ONNXRUNTIME_NODE_INSTALL: skip
        run: npm ci --prefer-offline
      # backend#1215: compile core4 in its own step, bounded only by the job's
      # timeout-minutes, so the health wait below measures startup only.
      - name: Build isolated core4 launch API
        working-directory: ${{ env.CORE4_DIR }}
        run: |
          build_started=$(date +%s)
          cargo build -p wrfcoin-native-chain --bin launch_api
          target_dir="$(cargo metadata --format-version 1 --no-deps \
            | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>process.stdout.write(JSON.parse(s).target_directory))')"
          launch_api_bin="$target_dir/debug/launch_api"
          test -x "$launch_api_bin"
          echo "LAUNCH_API_BIN=$launch_api_bin" >> "$GITHUB_ENV"
          echo "core4 launch_api build took $(( $(date +%s) - build_started ))s"
      - name: Start isolated core4 launch API
        run: |
          contract_data_dir="$RUNNER_TEMP/core4-contract-data"
          mkdir -p "$contract_data_dir"
          # Ephemeral debug producer key (#2290): the fresh chain seeds a
          # producer set at genesis and refuses to start without a usable
          # signer. Never a real key - generated per run, discarded with it.
          producer_key="$(openssl rand -hex 32)"
          producer_public_key="$(WRFCOIN_EPHEMERAL_SK="$producer_key" node -e '
            const { createPrivateKey, createPublicKey } = require("node:crypto");
            const seed = Buffer.from(process.env.WRFCOIN_EPHEMERAL_SK, "hex");
            const pkcs8 = Buffer.concat([
              Buffer.from("302e020100300506032b657004220420", "hex"),
              seed,
            ]);
            const privateKey = createPrivateKey({ key: pkcs8, format: "der", type: "pkcs8" });
            const spki = createPublicKey(privateKey).export({ format: "der", type: "spki" });
            process.stdout.write(spki.subarray(-32).toString("hex"));
          ')"
          producer_payout="0x${producer_public_key:0:40}"
          genesis_producer_set="$(printf '{"version":1,"members":[{"producer_id":"backend-contract","payout_address":"%s","public_key":"%s"}]}' \
            "$producer_payout" "$producer_public_key")"
          (
            cd "$CORE4_DIR"
            WRFCOIN_GENESIS_PRODUCER_SET="$genesis_producer_set" \
            WRFCOIN_PRODUCER_SIGNER_PRIVATE_KEY="$producer_key" \
            WRFCOIN_PRODUCER_PAYOUT_ADDRESS="$producer_payout" \
            WRFCOIN_API_HOST=127.0.0.1 \
            WRFCOIN_API_PORT=18556 \
            WRFCOIN_DATA_DIR="$contract_data_dir" \
            WRFCOIN_OPERATOR_TOKEN=core4-contract-test-token \
            WRFCOIN_READER_TOKEN=core4-contract-reader-test-token \
            WRFCOIN_CHAIN_ID=777 \
            WRFCOIN_NETWORK_ID=testnet \
            ALLOW_UNENCRYPTED_STORAGE=true \
            RUST_LOG=warn \
            "$LAUNCH_API_BIN" \
              > "$RUNNER_TEMP/core4-contract.log" 2>&1 &
            echo $! > "$RUNNER_TEMP/core4-contract.pid"
          )
          # Startup only: the binary is already built (previous step).
          start_started=$(date +%s)
          for attempt in $(seq 1 90); do
            if curl --fail --silent --show-error \
              -H 'Authorization: Bearer core4-contract-test-token' \
              http://127.0.0.1:18556/health; then
              echo
              echo "core4 launch_api healthy after $(( $(date +%s) - start_started ))s (attempt $attempt; no compile in this window)"
              exit 0
            fi
            if ! kill -0 "$(cat "$RUNNER_TEMP/core4-contract.pid")" 2>/dev/null; then
              echo "core4 launch_api exited before becoming healthy"
              break
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/core4-contract.log"
          exit 1
      - name: Run real backend to core4 HTTP contract
        env:
          DATABASE_URL: postgres://127.0.0.1:1/unused
          REDIS_URL: redis://127.0.0.1:1
          WRFCOIN_CORE4_URL: http://127.0.0.1:18556
          WRFCOIN_OPERATOR_TOKEN: core4-contract-test-token
          WRFCOIN_READER_TOKEN: core4-contract-reader-test-token
          # Fail hard here if the env is ever lost — a skip in THIS job would
          # be vacuous green (the plain suite skips by design instead).
          WRFCOIN_REQUIRE_LIVE_CORE4: "1"
        # The canonical config (as `npm test`): it transforms ESM deps such as
        # drizzle-orm, which the backend routes exercised here import (#1242).
        run: npx jest --config __tests__/jest.standalone.cjs __tests__/integration/core4-live-http-contract.test.ts --runInBand
      - name: Stop isolated core4 launch API
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/core4-contract.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/core4-contract.pid")" || true
          fi
          if [ -f "$RUNNER_TEMP/core4-contract.log" ]; then
            cat "$RUNNER_TEMP/core4-contract.log"
          fi
