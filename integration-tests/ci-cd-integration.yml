# CI/CD Integration Configuration for Task 67 Integration Tests
# GitHub Actions workflow for automated testing

name: Task 67 API & Backend Services Integration Tests

on:
  push:
    branches: [main, develop]
    paths:
      - 'backend/**'
      - 'graphql/**'
      - 'server/**'
      - 'integration-tests/**'
  pull_request:
    branches: [main, develop]
    paths:
      - 'backend/**'
      - 'graphql/**'
      - 'server/**'
      - 'integration-tests/**'
  schedule:
    # Run integration tests daily at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      test_suite:
        description: 'Test suite to run'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - comprehensive
          - service-communication
          - performance-validation
          - security-integration

env:
  NODE_VERSION: '24.x'
  POSTGRES_VERSION: '15'
  REDIS_VERSION: '7'

jobs:
  # Setup and validation job
  setup:
    name: Setup and Environment Validation
    runs-on: ubuntu-latest
    timeout-minutes: 10

    outputs:
      test-suites: ${{ steps.determine-suites.outputs.suites }}
      cache-key: ${{ steps.cache-key.outputs.key }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Generate cache key
        id: cache-key
        run: |
          echo "key=integration-deps-${{ hashFiles('backend/package-lock.json') }}-${{ github.sha }}" >> $GITHUB_OUTPUT

      - name: Cache dependencies
        uses: actions/cache@v3
        with:
          path: |
            backend/node_modules
            ~/.npm
          key: ${{ steps.cache-key.outputs.key }}
          restore-keys: |
            integration-deps-${{ hashFiles('backend/package-lock.json') }}-
            integration-deps-

      - name: Install dependencies
        working-directory: backend
        run: |
          npm ci --only=production
          npm install --only=dev

      - name: Determine test suites to run
        id: determine-suites
        run: |
          if [ "${{ github.event.inputs.test_suite }}" = "all" ] || [ -z "${{ github.event.inputs.test_suite }}" ]; then
            echo "suites=[\"comprehensive\", \"service-communication\", \"performance-validation\", \"security-integration\"]" >> $GITHUB_OUTPUT
          else
            echo "suites=[\"${{ github.event.inputs.test_suite }}\"]" >> $GITHUB_OUTPUT
          fi

      - name: Validate test files
        working-directory: backend
        run: |
          for suite in comprehensive service-communication performance-validation security-integration; do
            if [ -f "integration-tests/${suite}.integration.test.js" ] || [ -f "integration-tests/${suite}.test.js" ]; then
              echo "✅ ${suite} test file found"
            else
              echo "❌ ${suite} test file missing"
              exit 1
            fi
          done

  # Database and Redis setup
  infrastructure:
    name: Setup Infrastructure Services
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: setup

    services:
      postgres:
        image: postgres:${{ env.POSTGRES_VERSION }}
        env:
          POSTGRES_DB: wrfcoin_test
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_HOST_AUTH_METHOD: trust
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:${{ env.REDIS_VERSION }}-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Restore dependencies cache
        uses: actions/cache@v3
        with:
          path: |
            backend/node_modules
            ~/.npm
          key: ${{ needs.setup.outputs.cache-key }}

      - name: Wait for PostgreSQL
        run: |
          timeout 60 bash -c 'until pg_isready -h localhost -p 5432; do sleep 1; done'

      - name: Wait for Redis
        run: |
          timeout 60 bash -c 'until redis-cli -h localhost -p 6379 ping; do sleep 1; done'

      - name: Setup test database schema
        working-directory: backend
        env:
          TEST_DATABASE_URL: postgresql://test_user:test_password@localhost:5432/wrfcoin_test
        run: |
          node -e "
            const { Pool } = require('pg');
            const db = new Pool({ connectionString: process.env.TEST_DATABASE_URL });
            
            (async () => {
              try {
                await db.query('SELECT version()');
                console.log('✅ PostgreSQL connection successful');
                
                // Create basic test schema
                await db.query(\`
                  CREATE TABLE IF NOT EXISTS test_table (
                    id TEXT PRIMARY KEY,
                    data TEXT,
                    created_at TIMESTAMP DEFAULT NOW()
                  )
                \`);
                
                console.log('✅ Test schema created');
              } catch (error) {
                console.error('❌ Database setup failed:', error);
                process.exit(1);
              } finally {
                await db.end();
              }
            })();
          "

      - name: Test Redis connectivity
        run: |
          redis-cli -h localhost -p 6379 set test_key test_value
          redis-cli -h localhost -p 6379 get test_key
          redis-cli -h localhost -p 6379 del test_key
          echo "✅ Redis connectivity confirmed"

  # Integration test execution matrix
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [setup, infrastructure]

    strategy:
      fail-fast: false
      matrix:
        test-suite: ${{ fromJson(needs.setup.outputs.test-suites) }}

    services:
      postgres:
        image: postgres:${{ env.POSTGRES_VERSION }}
        env:
          POSTGRES_DB: wrfcoin_test
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_HOST_AUTH_METHOD: trust
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:${{ env.REDIS_VERSION }}-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    env:
      TEST_DATABASE_URL: postgresql://test_user:test_password@localhost:5432/wrfcoin_test
      TEST_REDIS_URL: redis://localhost:6379/1
      NODE_ENV: test
      LOG_LEVEL: error

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Restore dependencies cache
        uses: actions/cache@v3
        with:
          path: |
            backend/node_modules
            ~/.npm
          key: ${{ needs.setup.outputs.cache-key }}

      - name: Install dependencies if cache miss
        working-directory: backend
        run: |
          if [ ! -d "node_modules" ]; then
            npm ci
          fi

      - name: Setup test environment
        working-directory: backend
        run: |
          # Wait for services
          timeout 60 bash -c 'until pg_isready -h localhost -p 5432; do sleep 1; done'
          timeout 60 bash -c 'until redis-cli -h localhost -p 6379 ping; do sleep 1; done'

          # Create test schema
          node integration-tests/test-automation.js --setup-only

      - name: Run ${{ matrix.test-suite }} integration tests
        working-directory: backend
        run: |
          npx jest \
            --config integration-tests/jest.integration.config.js \
            --testPathPattern "${{ matrix.test-suite }}" \
            --verbose \
            --forceExit \
            --detectOpenHandles \
            --coverage \
            --coverageDirectory "test-results/coverage/${{ matrix.test-suite }}" \
            --outputFile "test-results/${{ matrix.test-suite }}-results.json" \
            --testResultsProcessor "jest-junit" \
            --runInBand
        env:
          JEST_JUNIT_OUTPUT_DIR: test-results
          JEST_JUNIT_OUTPUT_NAME: ${{ matrix.test-suite }}-junit.xml

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.test-suite }}
          path: |
            backend/test-results/
            backend/logs/
          retention-days: 7

      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-${{ matrix.test-suite }}
          path: backend/test-results/coverage/
          retention-days: 7

      - name: Publish test results
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Integration Tests - ${{ matrix.test-suite }}
          path: backend/test-results/${{ matrix.test-suite }}-junit.xml
          reporter: jest-junit
          fail-on-error: true

  # Performance regression testing
  performance-regression:
    name: Performance Regression Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [setup, infrastructure]
    if: github.event_name == 'pull_request'

    services:
      postgres:
        image: postgres:${{ env.POSTGRES_VERSION }}
        env:
          POSTGRES_DB: wrfcoin_test
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:${{ env.REDIS_VERSION }}-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Restore dependencies cache
        uses: actions/cache@v3
        with:
          path: |
            backend/node_modules
            ~/.npm
          key: ${{ needs.setup.outputs.cache-key }}

      - name: Run performance benchmarks
        working-directory: backend
        env:
          TEST_DATABASE_URL: postgresql://test_user:test_password@localhost:5432/wrfcoin_test
          TEST_REDIS_URL: redis://localhost:6379/1
        run: |
          node performance/run-task67-benchmarks.ts > performance-results.json

      - name: Download baseline performance data
        uses: actions/download-artifact@v4
        with:
          name: baseline-performance
          path: baseline/
        continue-on-error: true

      - name: Compare performance results
        run: |
          node -e "
            const fs = require('fs');
            const current = JSON.parse(fs.readFileSync('backend/performance-results.json', 'utf8'));
            
            try {
              const baseline = JSON.parse(fs.readFileSync('baseline/performance-results.json', 'utf8'));
              
              const regression = {
                avgResponseTime: (current.avgResponseTime / baseline.avgResponseTime - 1) * 100,
                throughput: (current.throughput / baseline.throughput - 1) * 100,
                errorRate: (current.errorRate / baseline.errorRate - 1) * 100
              };
              
              console.log('Performance Comparison:');
              console.log(\`Average Response Time: \${regression.avgResponseTime.toFixed(2)}% change\`);
              console.log(\`Throughput: \${regression.throughput.toFixed(2)}% change\`);
              console.log(\`Error Rate: \${regression.errorRate.toFixed(2)}% change\`);
              
              // Fail if significant regression
              if (regression.avgResponseTime > 20 || regression.throughput < -20 || regression.errorRate > 50) {
                console.error('❌ Significant performance regression detected!');
                process.exit(1);
              }
              
              console.log('✅ No significant performance regression detected');
            } catch (error) {
              console.log('No baseline performance data found. Current results will become baseline.');
            }
          "

      - name: Upload performance results
        uses: actions/upload-artifact@v4
        with:
          name: current-performance
          path: backend/performance-results.json

  # Security scan
  security-scan:
    name: Security Vulnerability Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: setup

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Restore dependencies cache
        uses: actions/cache@v3
        with:
          path: |
            backend/node_modules
            ~/.npm
          key: ${{ needs.setup.outputs.cache-key }}

      - name: Run npm audit
        working-directory: backend
        run: |
          npm audit --audit-level high --production
        continue-on-error: true

      - name: Run security linting
        working-directory: backend
        run: |
          npx eslint . --ext .js,.ts --config .eslintrc.security.js || true

      - name: Check OpenForis demo credentials in runtime paths
        working-directory: backend
        run: |
          npm run security:check-openforis-demo

      - name: Check for hardcoded secrets
        run: |
          # Simple check for common secret patterns
          if grep -r -E "(password|secret|key|token|api_key)\s*[:=]\s*['\"][^'\"]{8,}" backend/ --exclude-dir=node_modules --exclude-dir=test-results; then
            echo "❌ Potential hardcoded secrets found!"
            exit 1
          fi
          echo "✅ No obvious hardcoded secrets detected"

  # Consolidate and report results
  results:
    name: Consolidate Test Results
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [integration-tests, performance-regression, security-scan]
    if: always()

    steps:
      - name: Download all test results
        uses: actions/download-artifact@v4
        with:
          path: all-results/

      - name: Consolidate results
        run: |
          echo "# Task 67 Integration Test Results" > summary.md
          echo "" >> summary.md
          echo "## Test Suite Results" >> summary.md
          echo "" >> summary.md

          for suite in comprehensive service-communication performance-validation security-integration; do
            if [ -f "all-results/test-results-${suite}/${suite}-junit.xml" ]; then
              echo "✅ ${suite}: Completed" >> summary.md
            else
              echo "❌ ${suite}: Failed or incomplete" >> summary.md
            fi
          done

          echo "" >> summary.md
          echo "## Coverage Summary" >> summary.md
          echo "Coverage reports available in artifacts" >> summary.md

          cat summary.md

      - name: Comment PR with results
        uses: actions/github-script@v7
        if: github.event_name == 'pull_request'
        with:
          script: |
            const fs = require('fs');
            const summary = fs.readFileSync('summary.md', 'utf8');

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: summary
            });

      - name: Set job status
        run: |
          # Check if any integration tests failed
          if ls all-results/test-results-*/failed-* 1> /dev/null 2>&1; then
            echo "❌ Some integration tests failed"
            exit 1
          else
            echo "✅ All integration tests passed"
          fi
